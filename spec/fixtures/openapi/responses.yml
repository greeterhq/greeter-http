# Fixed responses for spec/tooling/openapi_contract_spec.rb. Each entry is what a
# small Rack app returns for POST /greetings (or, for not_found, for any other
# request): a status, lower-case headers and a JSON body. Names and values are
# invented. The first group is described by openapi.yaml; the second group is
# not, so each entry in it must be refused.
described:
  created_201:
    status: 201
    headers: &version_headers
      content-type: application/json
      x-greeter-version: 1.2.3
      x-greeter-core-version: 0.1.3
    body:
      guest_name: Ada Example
      greeting: Hello, Ada Example!
      count: 1
      greeted_at: '2026-11-18T10:00:00Z'
  replay_200:
    status: 200
    headers: *version_headers
    body:
      guest_name: Ada Example
      greeting: Hello, Ada Example!
      count: 1
      greeted_at: '2026-11-18T10:00:00Z'
  counter_disabled_201:
    status: 201
    headers: *version_headers
    body:
      guest_name: Ada Example
      greeting: Hello, Ada Example!
      count: null
      greeted_at: '2026-11-18T10:00:00Z'
  missing_key_400:
    status: 400
    headers: *version_headers
    body:
      error: missing_idempotency_key
      message: Idempotency-Key header is required.
  conflict_409:
    status: 409
    headers: *version_headers
    body:
      error: idempotency_key_reused
      message: This Idempotency-Key was already used for a different request.
  too_large_413:
    status: 413
    headers: *version_headers
    body:
      error: payload_too_large
      message: Request body is too large.
  invalid_name_422:
    status: 422
    headers: *version_headers
    body:
      error: invalid_name
      message: Invalid name.
  internal_500:
    status: 500
    headers: *version_headers
    body:
      error: internal_error
      message: An unexpected error occurred.
  unavailable_503:
    status: 503
    headers:
      content-type: application/json
      x-greeter-version: 1.2.3
      x-greeter-core-version: 0.1.3
      retry-after: '1'
    body:
      error: temporarily_unavailable
      message: Please retry.
undescribed:
  teapot_418:
    status: 418
    headers: *version_headers
    body:
      error: teapot
      message: Not a real status.
  extra_field_201:
    status: 201
    headers: *version_headers
    body:
      guest_name: Ada Example
      greeting: Hello, Ada Example!
      count: 1
      greeted_at: '2026-11-18T10:00:00Z'
      replayed: false
  missing_count_201:
    status: 201
    headers: *version_headers
    body:
      guest_name: Ada Example
      greeting: Hello, Ada Example!
      greeted_at: '2026-11-18T10:00:00Z'
  string_count_201:
    status: 201
    headers: *version_headers
    body:
      guest_name: Ada Example
      greeting: Hello, Ada Example!
      count: '1'
      greeted_at: '2026-11-18T10:00:00Z'
  leaky_500:
    status: 500
    headers: *version_headers
    body:
      error: internal_error
      message: An unexpected error occurred.
      detail: a field the description does not allow
  missing_core_header_200:
    status: 200
    headers:
      content-type: application/json
      x-greeter-version: 1.2.3
    body:
      guest_name: Ada Example
      greeting: Hello, Ada Example!
      count: 1
      greeted_at: '2026-11-18T10:00:00Z'
unrouted:
  not_found_404:
    status: 404
    headers:
      content-type: application/json
    body:
      error: not_found
      message: Not found.
