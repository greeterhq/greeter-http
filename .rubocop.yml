plugins:
  - rubocop-rspec

# Merge our Exclude list with RuboCop's defaults instead of replacing them.
inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

# Namespace modules and small value/adapter classes are self-documenting here;
# matches the convention used by the sibling greeter-cli project.
Style/Documentation:
  Enabled: false

# Specs, features and perf scripts are inherently long / multi-step.
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'features/**/*'
    - 'perf/**/*'

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

# `Result`/`GreetedGuest` deliberately expose a `count` member; the override of
# Struct#count is intended and relied upon by callers.
Lint/StructNewOverride:
  Enabled: false

# The Lambda handler signature must accept `context:` even when unused.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

# AWS SDK request/response shapes and event<->Rack translation are inherently
# verbose (large literal hashes, many conditionals). Raise the metric ceilings
# to pragmatic values that still catch genuine bloat.
Metrics/MethodLength:
  Max: 25
  Exclude:
    - 'perf/**/*'
Metrics/AbcSize:
  Max: 25
  Exclude:
    - 'perf/**/*'
Metrics/ClassLength:
  Max: 150
Metrics/ModuleLength:
  Exclude:
    - 'perf/**/*'
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 10
  Exclude:
    - 'perf/**/*'

# `pk`, `now` and similar short names are idiomatic here (DynamoDB partition
# key, current time); `n`/`p`/`r` are iteration/percentile locals in perf scripts.
Naming/MethodParameterName:
  AllowedNames:
    - pk
    - sk
    - now
    - to
    - n
    - p
    - r

# ---------------------------------------------------------------------------
# Specs and features
#
# These suites use an intentional layout: contract/architecture specs describe
# behaviours rather than a single class, and deliberately declare helper
# constants (event fixtures dir, concrete-adapter lists) and lightweight step
# World helpers. Keep ordinary cops meaningful without fighting that structure.
# ---------------------------------------------------------------------------
RSpec/DescribeClass:
  Enabled: false

RSpec/LeadingSubject:
  Enabled: false

RSpec/LeakyConstantDeclaration:
  Exclude:
    - 'spec/**/*'

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'

Layout/ArgumentAlignment:
  Exclude:
    - 'spec/**/*'

Lint/UselessTimes:
  Exclude:
    - 'spec/**/*'

Style/StringConcatenation:
  Exclude:
    - 'features/**/*'

# Benchmark harnesses (perf/) and operational bin/ scripts (smoke, etc.) are
# printf-heavy (many `%.1f` latency formats); annotated tokens would only bloat
# them. They are standalone scripts, not library code.
Style/FormatStringToken:
  Exclude:
    - 'perf/**/*'
    - 'bin/**/*'
