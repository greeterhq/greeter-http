AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  greeter-http - greets a guest over HTTP (Lambda + API Gateway HTTP API) and
  keeps a per-guest greeting count in DynamoDB, idempotent under client retries.

Parameters:
  IdempotencyTtlSeconds:
    Type: Number
    Default: 86400
    Description: Retention window (seconds) for idempotency-key dedupe records.
  RouteThrottleBurst:
    Type: Number
    Default: 50
  RouteThrottleRate:
    Type: Number
    Default: 25
  Latencyp95ThresholdMs:
    Type: Number
    Default: 1000
  DynamoDbEndpoint:
    Type: String
    Default: ''
    Description: >
      Optional DynamoDB endpoint override for LOCAL development only (e.g.
      DynamoDB Local via `sam local`). Leave empty in real AWS so the SDK
      resolves the regional endpoint and task credentials.
  AlarmEmail:
    Type: String
    Default: ''
    Description: >
      Email address subscribed to the paging SNS topic. Leave empty to create
      the topic with no subscription (wire PagerDuty/Slack/etc. out of band).
  CanaryScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    Description: How often the Synthetics canary runs the health checks.

Globals:
  Function:
    Runtime: ruby3.3
    Timeout: 10
    MemorySize: 256
    Tracing: Active          # X-Ray active tracing

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:

  # --- Customer-managed KMS key --------------------------------------------
  # One CMK encrypts the Lambda environment variables (CKV_AWS_173), the
  # function log group and the API access-log group (CKV_AWS_158). The key
  # policy grants: the account root full admin (so the key is manageable), the
  # CloudWatch Logs service principal the operations it needs to encrypt log
  # streams (without this grant, log delivery to an encrypted group silently
  # fails), and the function role decrypt for its env vars (granted inline on
  # the role via the Lambda service at runtime; see the function policy).
  EncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: greeter-http CMK for logs and Lambda env var encryption.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
          - Sid: AllowCloudWatchAlarmsToPublishToEncryptedTopic
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'

  # --- DynamoDB table: counter items + TTL'd dedupe items -------------------
  GreetingsTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: >-
              Greeting counts are non-sensitive; AWS-owned SSE (SSEEnabled
              below) is sufficient. A customer-managed CMK adds key cost and
              management overhead with no confidentiality benefit here.
    Properties:
      BillingMode: PAY_PER_REQUEST          # on-demand
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:               # TTL on dedupe items
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:      # PITR
        PointInTimeRecoveryEnabled: true
      SSESpecification:                      # server-side encryption
        SSEEnabled: true

  # --- Lambda function ------------------------------------------------------
  # Suppressions below are deliberate design choices, not oversights (see each
  # comment). Encryption (env vars) and logging are addressed, not skipped.
  GreeterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              Not in a VPC by design — the function only calls DynamoDB over the
              public AWS endpoint; a VPC adds cold-start latency and NAT cost
              with no security gain for this workload.
          - id: CKV_AWS_116
            comment: >-
              No DLQ — invoked synchronously by API Gateway (request/response).
              DLQs apply only to async invocations; failures return to the
              caller as HTTP 5xx.
          - id: CKV_AWS_115
            comment: >-
              No reserved concurrency — backpressure is handled at the API
              Gateway stage throttle (RouteThrottleRate), a deliberate design
              choice; a function-level reservation is a different, unneeded
              lever here.
    Properties:
      Handler: lambda_function.handler
      CodeUri: ../
      # CKV_AWS_173: encrypt environment variables at rest with the CMK. The env
      # vars hold no secrets (table name, TTL, optional local endpoint), but a
      # CMK is cheap here and satisfies the control.
      KmsKeyArn: !GetAtt EncryptionKey.Arn
      Environment:
        Variables:
          GREETER_TABLE_NAME: !Ref GreetingsTable
          GREETER_IDEMPOTENCY_TTL_SECONDS: !Ref IdempotencyTtlSeconds
          GREETER_DYNAMODB_ENDPOINT: !Ref DynamoDbEndpoint
      # Least-privilege: read + the transactional conditional write only, scoped
      # to this one table's ARN. No wildcard table or action.
      #
      # The counter write is a TransactWriteItems containing a Put (dedupe item)
      # and an Update (counter). DynamoDB authorizes a transaction by the
      # UNDERLYING item actions, not by `TransactWriteItems`, so the role needs
      # PutItem + UpdateItem (not TransactWriteItems). GetItem covers the
      # pre-read and the replay read.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt GreetingsTable.Arn
            # Decrypt the CMK that protects this function's env vars. Scoped to
            # the one key ARN; Decrypt only (the runtime never encrypts).
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
      Events:
        PostGreeting:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /greetings
            Method: POST

  # Lambda log group with 14-day retention, CMK-encrypted (CKV_AWS_158).
  GreeterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GreeterFunction}
      RetentionInDays: 14
      KmsKeyId: !GetAtt EncryptionKey.Arn

  # Access-log group for the HTTP API, CMK-encrypted (CKV_AWS_158).
  # Name is stack-scoped so dev and prod stacks in the same account/region do
  # not collide on this account-global log-group name.
  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: 14
      KmsKeyId: !GetAtt EncryptionKey.Arn

  # --- HTTP API with route-level throttling + access logging ----------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref RouteThrottleBurst
        ThrottlingRateLimit: !Ref RouteThrottleRate
      # CKV_AWS_95: access logging to the CMK-encrypted group above. One JSON
      # line per request; no request/response bodies (so no guest name is
      # logged), only routing/latency/status metadata.
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","status":"$context.status",
          "protocol":"$context.protocol","responseLength":"$context.responseLength",
          "integrationLatency":"$context.integrationLatency"}

  # --- Paging SNS topic -----------------------------------------------------
  # Single destination for all three paging alarms (5xx, p95 latency, canary).
  # An optional email subscription is created when AlarmEmail is provided.
  PagingTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: greeter-http paging alarms
      KmsMasterKeyId: !Ref EncryptionKey   # CKV_AWS_26: encrypt the topic

  PagingEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref PagingTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # --- CloudWatch alarms (all three page via PagingTopic) -------------------
  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTTP API 5xx error rate is elevated.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: 0.05                 # 5% of requests
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PagingTopic
      OKActions:
        - !Ref PagingTopic

  HttpLatencyP95Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTTP API p95 latency is elevated.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 5
      Threshold: !Ref Latencyp95ThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PagingTopic
      OKActions:
        - !Ref PagingTopic

  # --- Synthetics canary: runs the same checks as bin/smoke every 5 min -----
  CanaryArtifactsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: >-
              Access logging on a throwaway canary-artifacts bucket would need a
              second logging bucket; not worth it for monitoring artifacts that
              already expire after 30 days.
          - id: CKV_AWS_21
            comment: >-
              Versioning disabled by design — canary artifacts are ephemeral
              (30-day lifecycle); versioning only adds cost and clutter.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt EncryptionKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-canary-artifacts
            Status: Enabled
            ExpirationInDays: 30

  CanaryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: canary-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt CanaryArtifactsBucket.Arn
                  - !Sub ${CanaryArtifactsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - cloudwatch:PutMetricData
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !GetAtt EncryptionKey.Arn

  HealthCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      # Canary names are account/region-global and capped at 21 chars, lowercase
      # alnum/hyphen/underscore. Use the stack name so dev and prod do not
      # collide (greeter-http-dev / greeter-http-prod are both within the cap).
      Name: !Ref AWS::StackName
      ArtifactS3Location: !Sub s3://${CanaryArtifactsBucket}/canary
      ExecutionRoleArn: !GetAtt CanaryRole.Arn
      RuntimeVersion: syn-nodejs-puppeteer-9.0
      StartCanaryAfterCreation: true
      Schedule:
        Expression: !Ref CanaryScheduleExpression
      RunConfig:
        TimeoutInSeconds: 60
        EnvironmentVariables:
          GREETER_BASE_URL: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
      Code:
        Handler: index.handler
        # Inline Node.js canary. Availability + correctness monitoring against
        # the live endpoint: valid greeting -> 2xx with an incrementing count;
        # malformed body -> 400. Latency is deliberately NOT asserted here — the
        # p95 SLO is owned by HttpLatencyP95Alarm (a metric alarm over real
        # request traffic) and perf/http_bench.rb; a synthetic pass/fail probe
        # over a handful of self-generated calls is the wrong tool for it.
        # Sends x-greeter-synthetic:true so this monitoring traffic is tagged in
        # logs and isolated in the counter (synthetic# key prefix). A failed
        # assertion throws, which fails the canary run and drives the
        # SuccessPercent alarm below.
        Script: |
          const https = require('https');
          const { URL } = require('url');

          const BASE = process.env.GREETER_BASE_URL;

          function post(bodyObj, rawBody) {
            const u = new URL(BASE.replace(/\/$/, '') + '/greetings');
            const body = rawBody !== undefined ? rawBody : JSON.stringify(bodyObj);
            const opts = {
              method: 'POST',
              hostname: u.hostname,
              path: u.pathname,
              headers: {
                'Content-Type': 'application/json',
                'Idempotency-Key': `canary-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                'x-greeter-synthetic': 'true',
              },
            };
            return new Promise((resolve, reject) => {
              const req = https.request(opts, (res) => {
                let data = '';
                res.on('data', (c) => (data += c));
                res.on('end', () => resolve({ status: res.statusCode, body: data }));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          const handler = async function () {
            // Check 1: valid greeting increments.
            const guest = `canary guest ${Date.now()}`;
            const r1 = await post({ name: guest });
            const r2 = await post({ name: guest });
            if (r1.status < 200 || r1.status >= 300 || r2.status < 200 || r2.status >= 300) {
              throw new Error(`valid greeting not 2xx: ${r1.status}/${r2.status}`);
            }
            const c1 = JSON.parse(r1.body).count;
            const c2 = JSON.parse(r2.body).count;
            if (!(typeof c1 === 'number' && typeof c2 === 'number' && c2 > c1)) {
              throw new Error(`count did not increment: ${c1} -> ${c2}`);
            }

            // Check 2: malformed body -> 400.
            const bad = await post(null, '{"name": ');
            if (bad.status !== 400) throw new Error(`malformed not 400: ${bad.status}`);
          };

          exports.handler = handler;

  CanarySuccessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: greeter-http health canary is failing its checks.
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref HealthCanary
      Statistic: Average
      Period: 300                      # one canary run (5 min)
      EvaluationPeriods: 1
      Threshold: 100                   # anything < 100% success pages
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching      # no data = canary not running = page
      AlarmActions:
        - !Ref PagingTopic
      OKActions:
        - !Ref PagingTopic

Outputs:
  ApiBaseUrl:
    Description: Base URL of the greeter HTTP API.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Description: DynamoDB table name.
    Value: !Ref GreetingsTable
  PagingTopicArn:
    Description: SNS topic that the three paging alarms notify.
    Value: !Ref PagingTopic
  HealthCanaryName:
    Description: CloudWatch Synthetics health canary.
    Value: !Ref HealthCanary
